<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Game Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <div class="panel-header">Проводник</div>
        <div class="toolbar">
            <button class="btn" onclick="createFolder()">📁 +Папка</button>
            <button class="btn" onclick="createFile()">📄 +Файл</button>
        </div>
        <!-- Быстрые кнопки вверху панели, если внизу перекроет клавиатура -->
        <div class="toolbar quick-controls">
            <button class="btn btn-run" onclick="runGame()">▶ Старт</button>
            <button class="btn btn-export" onclick="exportSingleWeb()">📦 Экспорт</button>
        </div>
        <div id="file-tree"></div>
    </div>

    <div id="editor-container">
        <div id="current-file-title">Выберите файл для редактирования</div>
        <div class="textarea-wrapper">
            <textarea id="code-editor" disabled></textarea>
        </div>
        
        <!-- Фиксированная нижняя панель для кнопок -->
        <div id="controls-fixed-bottom">
            <button class="btn btn-run-large" onclick="runGame()">▶ ЗАПУСТИТЬ ИГРУ</button>
            <button class="btn btn-export-large" onclick="exportSingleWeb()">📦 СКАЧАТЬ HTML-ИГРУ</button>
        </div>
    </div>

    <iframe id="game-preview"></iframe>
    <script src="script.js"></script>
</body>
</html>
