<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Game Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <div class="panel-header">Проводник</div>
        <div class="toolbar">
            <button class="btn" onclick="triggerCreateFolder()">📁 +Папка</button>
            <button class="btn" onclick="triggerCreateFile()">📄 +Файл</button>
        </div>
        <div id="current-dir-display" onclick="goBack()" style="cursor:pointer; padding:8px; background:#333; font-size:12px; color:#007acc; font-weight:bold;">📍 Назад [..]</div>
        <div id="file-tree"></div>
    </div>

    <div id="editor-container">
        <div id="current-file-title">Выберите файл для редактирования</div>
        <textarea id="code-editor" disabled></textarea>
    </div>

    <iframe id="game-preview"></iframe>
    <script src="script.js"></script>
</body>
</html>
